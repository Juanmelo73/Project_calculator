<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora sencilla</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Contenedor principal de todos los elementos de la calculadora. -->
    <main class="calculadora">
        <!-- La pantalla muestra la expresion introducida y el resultado. -->
        <input id="pantalla" type="text" value="0" aria-label="Resultado" readonly>

        <!-- Cada boton guarda su valor en data-valor para que JavaScript pueda leerlo. -->
        <section class="botones">
            <!-- Boton para borrar la expresion y botones de operaciones. -->
            <button class="limpiar" type="button" data-valor="C">C</button>
            <button class="operador" type="button" data-valor="/">/</button>
            <button class="operador" type="button" data-valor="*">*</button>
            <button class="operador" type="button" data-valor="-">-</button>

            <!-- Digitos y operador de suma. -->
            <button type="button" data-valor="7">7</button>
            <button type="button" data-valor="8">8</button>
            <button type="button" data-valor="9">9</button>
            <button class="operador" type="button" data-valor="+">+</button>

            <!-- Digitos y boton para resolver la operacion. -->
            <button type="button" data-valor="4">4</button>
            <button type="button" data-valor="5">5</button>
            <button type="button" data-valor="6">6</button>
            <button class="igual" type="button" data-valor="=">=</button>

            <!-- Digitos restantes y punto decimal. -->
            <button type="button" data-valor="1">1</button>
            <button type="button" data-valor="2">2</button>
            <button type="button" data-valor="3">3</button>
            <button type="button" data-valor="0">0</button>
            <button type="button" data-valor=".">.</button>
        </section>
    </main>

    <!-- Carga el codigo que controla los clics y las operaciones. -->
    <script src="js/script.js"></script>
</body>

</html>
